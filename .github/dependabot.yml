version: 2
updates:
  # Cập nhật phiên bản các action trong workflow
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Cập nhật phụ thuộc npm (pnpm-lock.yaml)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Gộp các bản vá/minor của devDependencies để giảm số PR
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
