<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thông báo và cài đặt email</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@300;400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#0A0F1F}
a{color:#2054F0}a:hover{color:#1840C8}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; background: #CDDBF2; padding: 12px; font-family: Inter, system-ui, sans-serif; color: #0A0F1F">
<div style="display: flex; flex-wrap: wrap; min-height: 776px; border-radius: 20px; overflow: hidden; border: 1px solid #E3E7EF; background: #FFFFFF">
<div style="flex: 999 1 320px; min-width: 0; background-color: #EEF2FD; background-image: linear-gradient(rgba(32,84,240,0.10) 1px, transparent 1px), linear-gradient(90deg, rgba(32,84,240,0.10) 1px, transparent 1px); background-size: 24px 24px; padding: 24px; display: flex; flex-direction: column; gap: 10px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #4A5163; display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: #E56DAF; display: inline-block; flex-shrink: 0"></span>Cổng thông tin nội bộ · Bảng (nền mờ khi mở thông báo)</span><div style="height: 56px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E3E7EF; opacity: 0.7"></div><div style="height: 56px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E3E7EF; opacity: 0.7"></div><div style="height: 56px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E3E7EF; opacity: 0.7"></div></div>
<aside aria-label="Thông báo" style="flex: 1 1 440px; max-width: 500px; box-sizing: border-box; background: #FFFFFF; border-left: 1px solid #E3E7EF; padding: 22px 26px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: flex-end"><div style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #4A5163; display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: #E56DAF; display: inline-block; flex-shrink: 0"></span>Hộp thư / 03 chưa đọc</span><h1 style="margin: 0; font-family: 'Inter Tight', Inter, system-ui, sans-serif; font-size: 28px; line-height: 34px; font-weight: 400; letter-spacing: -0.02em">Thông báo<span aria-hidden="true" style="color: #E56DAF">.</span></h1></div><a href="#" style="font-size: 13px">Đánh dấu tất cả đã đọc</a></div>
<div style="display: flex; gap: 8px"><button style="border: 1px solid #2054F0; background: #EEF2FD; color: #2054F0; border-radius: 999px; padding: 6px 14px; font: 600 13px Inter, sans-serif; min-height: 32px">Chưa đọc (3)</button><button style="border: 1px solid #6B7385; background: #FFFFFF; color: #4A5163; border-radius: 999px; padding: 6px 14px; font: 400 13px Inter, sans-serif; min-height: 32px">Tất cả</button></div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{items}}" as="n" hint-placeholder-count="5">
<div style="display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid #E3E7EF">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: {{n.dot}}; margin-top: 6px; flex-shrink: 0"></span>
<div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0"><span style="font-size: 14px; line-height: 20px; font-weight: {{n.weight}}">{{n.text}}</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #4A5163">{{n.when}}</span></div>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #E3E7EF; padding-top: 14px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #4A5163; display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: #E56DAF; display: inline-block; flex-shrink: 0"></span>Email / Nhận email khi</span>
<sc-for list="{{prefs}}" as="p" hint-placeholder-count="3">
<label style="display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; min-height: 40px; border-bottom: 1px solid #E3E7EF"><span>{{p.label}}</span><span style="display: inline-flex; align-items: center; gap: 8px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; color: {{p.tc}}">{{p.state}}</span><span style="width: 36px; height: 20px; border-radius: 10px; background: {{p.bg}}; position: relative; display: inline-block"><span style="position: absolute; top: 2px; left: {{p.left}}; width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF"></span></span></span></label>
</sc-for>
<span style="font-size: 12px; color: #4A5163; padding-top: 6px">Email nhắc hạn gộp thành một thư tóm tắt mỗi sáng.</span>
</div>
</aside></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const n = (text, when, unread) => ({ text, when, dot: unread ? '#E56DAF' : '#E3E7EF', weight: unread ? '600' : '400' });
const p = (label, on) => ({ label, bg: on ? '#2054F0' : '#6B7385', left: on ? '18px' : '2px', state: on ? 'BẬT' : 'TẮT', tc: on ? '#2054F0' : '#4A5163' });
return {
items: [
n('Nguyễn Minh Anh giao cho bạn task CTTT-24 Xây dựng trang danh sách dự án', 'Hôm nay 09:12', true),
n('CTTT-31 sắp đến hạn: còn 1 ngày (27/11)', 'Hôm nay 08:00', true),
n('Trần Quốc Bảo đổi trạng thái CTTT-25 sang Chờ review', 'Hôm qua 17:45', true),
n('Lê Thu Hà thêm bạn vào dự án Nâng cấp hệ thống kho với vai trò Thành viên', '12/11 11:00', false),
n('CTTT-19 đã bị xóa bởi Nguyễn Minh Anh', '12/11 10:20', false)
],
prefs: [p('Được giao việc', true), p('Task sắp đến hạn (tóm tắt mỗi sáng)', true), p('Task đổi trạng thái', false)]
};
}
}
</script>
</body>
</html>
