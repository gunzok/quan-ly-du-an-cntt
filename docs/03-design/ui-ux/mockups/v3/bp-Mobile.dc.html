<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Kanban trên điện thoại</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@300;400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#0A0F1F}
a{color:#2054F0}a:hover{color:#1840C8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; color: #0A0F1F; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 4px; min-height: 52px">
<button aria-label="Mở menu" style="width: 44px; height: 44px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A0F1F" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #4A5163; display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: #E56DAF; display: inline-block; flex-shrink: 0"></span>Dự án / 001</span>
<button aria-label="Thông báo, 3 chưa đọc" style="min-width: 44px; height: 44px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><span style="border: 1px solid #E56DAF; color: #B0256E; border-radius: 999px; padding: 0 8px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 20px">3</span></button>
</div>
<div style="padding: 0 16px 12px"><h1 style="margin: 0; font-family: 'Inter Tight', Inter, system-ui, sans-serif; font-size: 26px; line-height: 30px; font-weight: 400; letter-spacing: -0.02em">Cổng thông tin nội bộ<span aria-hidden="true" style="color: #E56DAF">.</span></h1></div>
<div style="display: flex; gap: 4px; padding: 0 12px 10px"><button style="flex: 1; min-height: 44px; border: 1px solid #2054F0; background: #EEF2FD; color: #2054F0; border-radius: 6px; font: 600 14px Inter, sans-serif">Bảng</button><button style="flex: 1; min-height: 44px; border: 1px solid #6B7385; background: #FFFFFF; color: #4A5163; border-radius: 6px; font: 400 14px Inter, sans-serif">Danh sách</button><button style="flex: 1; min-height: 44px; border: 1px solid #6B7385; background: #FFFFFF; color: #4A5163; border-radius: 6px; font: 400 14px Inter, sans-serif">Tổng quan</button></div>
<div style="display: flex; gap: 8px; padding: 10px 12px; overflow: hidden; align-items: center; border-top: 1px solid #E3E7EF; border-bottom: 1px solid #E3E7EF; background: #F7F8FA">
<span style="flex-shrink: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 9px 12px; border-radius: 999px; background: #2054F0; color: #FFFFFF; border: 1px solid #2054F0">02 / Đang làm · 3</span><span style="flex-shrink: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 9px 12px; border-radius: 999px; background: #FFFFFF; color: #4A5163; border: 1px solid #E3E7EF">01 / Cần làm · 3</span><span style="flex-shrink: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 9px 12px; border-radius: 999px; background: #FFFFFF; color: #4A5163; border: 1px solid #E3E7EF">03 / Chờ review · 2</span><span style="flex-shrink: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 9px 12px; border-radius: 999px; background: #FFFFFF; color: #4A5163; border: 1px solid #E3E7EF">04 / Xong · 2</span>
</div>
<div style="flex-grow: 1; overflow: hidden; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #F7F8FA">
<sc-for list="{{cards}}" as="k" hint-placeholder-count="3">
<article style="background: #FFFFFF; border: 1px solid #E3E7EF; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: center"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #4A5163">{{k.id}}</span>
<button aria-label="Chuyển đến cột khác" style="min-width: 44px; min-height: 44px; margin: -12px -10px -12px 0; border: 0; background: #FFFFFF; font-size: 18px; color: #4A5163">⋯</button></div>
<span style="font-size: 15px; line-height: 22px; font-weight: 500">{{k.title}}</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: {{k.pbg}}; color: {{k.pfg}}; font-weight: 500">{{k.prio}}</span><span style="font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid #E3E7EF; color: #4A5163">{{k.label}}</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid #E3E7EF">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: {{k.dueColor}}; font-weight: {{k.dueWeight}}">{{k.due}}</span>
<span style="width: 26px; height: 26px; border-radius: 13px; background: {{k.abg}}; color: {{k.afg}}; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">{{k.who}}</span>
</div>
</article>
</sc-for>
</div>
<nav aria-label="Điều hướng chính" style="display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #E3E7EF; background: #FFFFFF"><a href="#" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; color: #2054F0; text-decoration: none"><span aria-hidden="true" style="width: 16px; height: 2px; border-radius: 1px; background: #2054F0"></span>Dự án</a><a href="#" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #4A5163; text-decoration: none"><span aria-hidden="true" style="width: 16px; height: 2px; border-radius: 1px; background: transparent"></span>Việc của tôi</a><a href="#" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #4A5163; text-decoration: none"><span aria-hidden="true" style="width: 16px; height: 2px; border-radius: 1px; background: transparent"></span>Thông báo</a><a href="#" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #4A5163; text-decoration: none"><span aria-hidden="true" style="width: 16px; height: 2px; border-radius: 1px; background: transparent"></span>Hồ sơ</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const P = { urgent: ['▲▲ Khẩn cấp', '#FEE2E2', '#C0262D'], high: ['▲ Cao', '#FEF3C7', '#A34A06'], mid: ['■ Trung bình', '#EEF2FD', '#4A5163'] };
const A = { MA: ['#DCE4FD', '#1A3BB0'], QB: ['#DCFCE7', '#14532D'], TH: ['#FEF3C7', '#78350F'] };
const c = (id, title, p, label, due, late, who) => ({
id, title, prio: P[p][0], pbg: P[p][1], pfg: P[p][2], label, due: (late ? 'Trễ · ' : 'Hạn · ') + due,
dueColor: late ? '#C0262D' : '#4A5163', dueWeight: late ? '600' : '400', who, abg: A[who][0], afg: A[who][1]
});
return { cards: [
c('CTTT-24', 'Xây dựng trang danh sách dự án', 'urgent', 'Tính năng', '15/11', true, 'MA'),
c('CTTT-31', 'API tìm kiếm và bộ lọc', 'high', 'Tính năng', '22/11', false, 'QB'),
c('CTTT-35', 'Tích hợp đăng nhập Google', 'mid', 'Bảo mật', '28/11', false, 'TH')
] };
}
}
</script>
</body>
</html>
