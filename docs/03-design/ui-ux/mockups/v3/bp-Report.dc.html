<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Xuất báo cáo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@300;400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#0A0F1F}
a{color:#2054F0}a:hover{color:#1840C8}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; background-color: #0A0F1F; background-image: linear-gradient(rgba(123,151,255,0.10) 1px, transparent 1px), linear-gradient(90deg, rgba(123,151,255,0.10) 1px, transparent 1px); background-size: 24px 24px; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: Inter, system-ui, sans-serif; color: #0A0F1F">
<div role="dialog" aria-label="Xuất báo cáo tiến độ" style="width: 540px; max-width: 100%; background: #FFFFFF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 16px 40px rgba(0,0,0,0.45)">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #4A5163; display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: #E56DAF; display: inline-block; flex-shrink: 0"></span>Xuất / Báo cáo · Cổng thông tin nội bộ</span><h1 style="margin: 0; font-family: 'Inter Tight', Inter, system-ui, sans-serif; font-size: 26px; line-height: 32px; font-weight: 400; letter-spacing: -0.02em">Xuất báo cáo tiến độ<span aria-hidden="true" style="color: #E56DAF">.</span></h1></div>
<button aria-label="Đóng" style="border: 1px solid #6B7385; background: #FFFFFF; border-radius: 6px; width: 32px; height: 32px; font-size: 16px; color: #0A0F1F">×</button>
</div>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #4A5163; display: inline-flex; align-items: center; gap: 8px">01 / Định dạng</span></legend>
<label style="display: flex; align-items: center; gap: 12px; border: 2px solid #2054F0; background: #EEF2FD; border-radius: 10px; padding: 11px 13px; font-size: 14px"><input type="radio" name="fmt" checked style="margin: 0"><span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><b>Excel</b><span style="color: #4A5163; font-size: 13px">Bảng số liệu, dễ chỉnh sửa</span></span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #2054F0">.XLSX</span></label>
<label style="display: flex; align-items: center; gap: 12px; border: 1px solid #6B7385; background: #FFFFFF; border-radius: 10px; padding: 12px 14px; font-size: 14px"><input type="radio" name="fmt" style="margin: 0"><span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><b>Word</b><span style="color: #4A5163; font-size: 13px">Báo cáo theo mẫu công ty</span></span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #4A5163">.DOCX</span></label>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #4A5163; display: inline-flex; align-items: center; gap: 8px">02 / Khoảng thời gian</span>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px"><div style="display: flex; flex-direction: column; gap: 6px"><label for="from" style="font-size: 14px; font-weight: 500">Từ ngày</label><input id="from" type="text" value="01/11/2026" style="border: 1px solid #6B7385; border-radius: 6px; padding: 9px 12px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: #0A0F1F"></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="to" style="font-size: 14px; font-weight: 500">Đến ngày</label><input id="to" type="text" value="30/11/2026" style="border: 1px solid #6B7385; border-radius: 6px; padding: 9px 12px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: #0A0F1F"></div></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #4A5163; display: inline-flex; align-items: center; gap: 8px">03 / Template</span><label for="tpl" style="font-size: 14px; font-weight: 500">Template báo cáo</label>
<select id="tpl" style="border: 1px solid #6B7385; border-radius: 6px; padding: 9px 12px; font: 400 14px Inter, sans-serif; color: #0A0F1F; background: #FFFFFF"><option>Báo cáo tiến độ tuần (mẫu công ty)</option></select></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #E3E7EF; border-radius: 10px; overflow: hidden">
<div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #4A5163; display: inline-flex; align-items: center; gap: 8px">Task</span><span style="font-family: 'Inter Tight', Inter, system-ui, sans-serif; font-weight: 300; font-size: 26px; line-height: 30px">48</span></div>
<div style="padding: 10px 12px; border-left: 1px solid #E3E7EF; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #4A5163; display: inline-flex; align-items: center; gap: 8px">Hoàn thành</span><span style="font-family: 'Inter Tight', Inter, system-ui, sans-serif; font-weight: 300; font-size: 26px; line-height: 30px">30</span></div>
<div style="padding: 10px 12px; border-left: 1px solid #E3E7EF; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #4A5163; display: inline-flex; align-items: center; gap: 8px">Trễ hạn</span><span style="font-family: 'Inter Tight', Inter, system-ui, sans-serif; font-weight: 300; font-size: 26px; line-height: 30px; color: #C0262D">3</span></div>
</div>
<span style="font-size: 12px; color: #4A5163">Dự án lớn có thể mất đến 30 giây.</span>
<div style="display: flex; justify-content: flex-end; gap: 8px"><button style="background: #FFFFFF; color: #2054F0; border: 1px solid #6B7385; border-radius: 6px; padding: 7px 14px; font: 500 14px Inter, sans-serif; min-height: 36px; display: inline-flex; align-items: center; gap: 8px">Hủy</button><button style="background: #2054F0; color: #FFFFFF; border: 1px solid #2054F0; border-radius: 6px; padding: 7px 14px; font: 500 14px Inter, sans-serif; min-height: 36px; display: inline-flex; align-items: center; gap: 8px">Tạo và tải xuống <span aria-hidden="true">→</span></button></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
